name: Deploy Elsewhere to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: search-service/requirements*.txt

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Install search collector dependencies
        run: python -m pip install -r search-service/requirements-dev.txt

      - name: Test search collector
        working-directory: search-service
        run: python -m unittest discover -s tests -v

      - name: Restore last published index
        run: node scripts/load-last-index.mjs

      - name: Prepare destination search queries
        if: github.event_name != 'push'
        run: npm run data:queries

      - name: Find indexed traveller discussion links
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 6
        run: python search-service/search_batch.py --input .local/discussion-queries.json --output .local/discussion-results.json

      - name: Extract configured place listings with Scrapling
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 5
        run: python search-service/scrape_places.py --sources data/scrapling-sources.json --destinations data/india-destinations.json --output .local/scraped-places.json

      - name: Refresh India places and source links
        if: github.event_name != 'push'
        continue-on-error: true
        timeout-minutes: 15
        shell: bash
        run: |
          refresh_args=()
          if [ -f .local/discussion-results.json ]; then
            refresh_args+=(--evidence .local/discussion-results.json)
          fi
          if [ -f .local/scraped-places.json ]; then
            refresh_args+=(--scraped .local/scraped-places.json)
          fi
          npm run data:refresh -- "${refresh_args[@]}"

      - name: Build public site
        run: npm run build
        env:
          VITE_BASE_PATH: /finder/
          VITE_SEARCH_MODE: public

      - name: Upload static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
