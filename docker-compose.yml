name: elsewhere-search

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SEARXNG_BASE_URL: "http://localhost:8080/"
      SEARXNG_PORT: "8080"
      SEARXNG_SECRET: "${SEARXNG_SECRET:?Set SEARXNG_SECRET in your shell or .env; see README.md}"
    volumes:
      - ./searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng

volumes:
  searxng-cache:
